[project]
name = "tamagotchi-desk-pet"
version = "0.1.0"
description = "Laptop application for the Tamagotchi desk pet"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pyserial>=3.5",
    "pyyaml>=6.0.3",
    "tzdata; sys_platform == 'win32'",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "deskpet"

[dependency-groups]
dev = [
    "pyright>=1.1.405",
    "ruff>=0.13.0",
    "types-pyserial>=3.5.0.20260712",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "tests"]
exclude = [".venv"]
