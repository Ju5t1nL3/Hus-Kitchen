identity:
  user_id: local-user
  pet_id: pet-1
  device_id: laptop-1

focus:
  allowed_minutes: [5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55, 60]
  default_minutes: 25
  focus_minutes_per_break_minute: 5
  minimum_break_minutes: 1
  grace_active_seconds: 60
  happy_seconds: 15
  sad_seconds: 30
  report_timezone: America/Chicago

feeding:
  hunger_seconds: 300
  definitions:
    jollof_rice:
      display_name: Jollof Rice
      sprite_id: jollof_rice
      price_yarn: 3
      happy_seconds: 15
      consume_animation: feed
    coffee:
      display_name: Coffee
      sprite_id: coffee
      price_yarn: 2
      happy_seconds: 15
      consume_animation: feed

progression:
  policy_version: 1
  starting_yarn: 10
  xp_per_level: 100

controls:
  bindings:
    home:
      1.press: open_feed
      2.press: open_setup
      3.press: pet
    feed:
      1.press: buy_jollof
      2.press: buy_coffee
      3.press: back_home
    setup:
      1.press: cycle_duration
      2.press: confirm_focus
      3.press: back_home
    focus_running:
      1.press: show_time
      2.press: pause_current
      3.press: end_current
    focus_paused:
      1.press: show_time
      2.press: resume_current
      3.press: end_current
    break_offer:
      1.press: start_break
      2.press: restart_focus
      3.press: skip_break
    break_running:
      1.press: restart_focus
      2.press: end_break

ui:
  clock_timezone: America/Chicago
  max_buttons: 3

device:
  port: null
  usb_vid: 11914
  usb_pid: 5
  serial_number: null
