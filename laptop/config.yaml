identity:
  user_id: local-user
  pet_id: pet-1
  device_id: laptop-1

focus:
  allowed_minutes: [5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55, 60]
  default_minutes: 25
  focus_minutes_per_break_minute: 5
  minimum_break_minutes: 1
  grace_active_seconds: 60
  happy_seconds: 15
  sad_seconds: 30
  report_timezone: America/Chicago

feeding:
  hunger_seconds: 300
  definitions:
    jollof_rice:
      display_name: Jollof Rice
      sprite_id: jollof_rice
      price_yarn: 3
      happy_seconds: 15
      consume_animation: feed
    espresso:
      display_name: Espresso
      sprite_id: espresso
      price_yarn: 2
      happy_seconds: 15
      consume_animation: feed

progression:
  policy_version: 3
  starting_yarn: 10
  xp_per_level: 75
  xp_level_increment: 25
  xp_per_focus_minute: 3
  yarn_minutes_per_unit: 10
  chain_xp_percent: 15
  chain_yarn_per_step: 1

activity:
  keyboard_one_yarn_keypresses: 500
  keyboard_two_yarn_keypresses: 1000
  camera_minimum_coverage_percent: 60
  camera_one_yarn_attention_percent: 70
  camera_two_yarn_attention_percent: 90

# Button IDs map to the device's four screen corners:
#   1 top-left   2 top-right   3 bottom-left   4 bottom-right
# Buttons 1-2 keep the meanings designed for the three-button build. On home,
# Settings (bottom-left, a gear icon replacing the old hold-button-1 gesture)
# and Pet (bottom-right) fill the two new corners. On setup/settings, Down
# (bottom-left, a caret) and Back (bottom-right) do the same.
controls:
  bindings:
    home:
      1.press: open_setup
      2.press: open_feed
      3.press: open_settings
      4.press: pet
    feed:
      1.press: buy_jollof
      2.press: buy_espresso
      3.press: back_home
    setup:
      1.press: cycle_duration
      2.press: confirm_focus
      3.press: cycle_duration_back
      4.press: back_home
    focus_running:
      1.press: show_time
      2.press: pause_current
      3.press: end_current
    focus_paused:
      1.press: show_time
      2.press: resume_current
      3.press: end_current
    break_offer:
      1.press: start_break
      2.press: restart_focus
      3.press: skip_break
    break_running:
      1.press: restart_focus_from_break
      2.press: end_break
    settings:
      1.press: cycle_setting
      2.press: toggle_setting
      3.press: cycle_setting_back
      4.press: back_home

ui:
  clock_timezone: America/Chicago
  max_buttons: 4

# TinyCircuits TinyScreen+ native USB CDC identity (0x03EB / 0x8009).
device:
  port: null
  usb_vid: 1003
  usb_pid: 32777
  serial_number: null
